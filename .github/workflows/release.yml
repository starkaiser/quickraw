# QuickRAW release builds: Linux AppImage, Windows .exe, macOS .dmg (Apple Silicon + Intel),
# plus a FreeBSD build check.
#
#   * every push / pull request: build all packages and keep them as workflow artifacts
#   * pushing a tag like v1.0.0:  also publish them on a GitHub Release
#   * "Run workflow" button:      manual build
name: release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux AppImage
    # Oldest supported Ubuntu runner: the AppImage runs on its glibc (2.35) or newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran-12 gcc make pkg-config curl file libraw-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Build AppImage
        run: GFORTRAN=gfortran-12 packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: quickraw-linux
          path: dist/*.AppImage

  windows:
    name: Windows exe
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libraw
            mingw-w64-ucrt-x86_64-lcms2
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-zlib
      - name: Build exe
        run: packaging/windows/build-exe.sh --no-deps
      - uses: actions/upload-artifact@v4
        with:
          name: quickraw-windows
          path: dist/*.exe

  macos:
    name: macOS dmg (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15         # Apple Silicon
            arch: arm64
          - runner: macos-15-intel   # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install gcc libraw dylibbundler pkg-config
      - name: Build dmg
        run: packaging/macos/build-dmg.sh
        # For a signed + notarized build, add repository secrets and pass e.g.
        #   CODESIGN_IDENTITY: "Developer ID Application: Your Name (TEAMID)"
        #   NOTARY_PROFILE: ...  (after importing the certificate into the keychain)
      - uses: actions/upload-artifact@v4
        with:
          name: quickraw-macos-${{ matrix.arch }}
          path: dist/*.dmg

  freebsd:
    name: FreeBSD build
    # GitHub has no FreeBSD runners: compile inside a FreeBSD virtual machine.
    # A build check only (no package), and not required for publishing a release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y gmake gcc pkgconf libraw git bash libX11 libXrandr libXinerama \
              libXcursor libXi mesa-libs
          run: |
            ./packaging/fetch-deps.sh
            gmake -j2
            ./quickraw --version

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
